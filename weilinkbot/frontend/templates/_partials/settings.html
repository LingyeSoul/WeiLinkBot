    <!-- Settings Tab -->
    <div x-show="activeTab === 'settings'" style="max-width:720px;margin:0 auto;" class="space-y-6">
      <div class="page-header">
        <h1 class="page-title" x-text="t('settings.title')">系统设置</h1>
        <p class="page-subtitle" x-text="t('settings.subtitle') || '服务器和提示词配置'">服务器和提示词配置</p>
      </div>

      <!-- Server Settings -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title" x-text="t('settings.server')">服务器设置</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" x-text="t('settings.host') || '监听地址'">监听地址</label>
            <input class="form-input" x-model="settingsForm.server_host" type="text" placeholder="0.0.0.0">
          </div>
          <div class="form-group">
            <label class="form-label" x-text="t('settings.port')">端口</label>
            <input class="form-input" x-model.number="settingsForm.server_port" type="number" placeholder="5292">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" x-text="t('settings.language')">语言</label>
          <select class="form-select" x-model="settingsForm.language">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-toggle-row">
          <div>
            <div class="form-toggle-label" x-text="t('settings.listen_lan')">局域网监听</div>
            <div class="form-toggle-desc" x-text="t('settings.listen_lan_hint')">允许局域网内其他设备访问</div>
          </div>
          <label class="toggle">
            <input type="checkbox" x-model="settingsForm.listen_lan">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>

      <!-- Prompt Settings -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title" x-text="t('settings.prompt')">提示词设置</h3>
        </div>
        <p style="font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--space-4)" x-text="t('settings.prompt_hint')">启用后，当对应功能激活时将禁用基础系统提示词</p>
        <div class="form-toggle-row">
          <div>
            <div class="form-toggle-label" x-text="t('settings.disable_on_char')">角色卡激活时禁用基础提示词</div>
          </div>
          <label class="toggle">
            <input type="checkbox" x-model="settingsForm.disable_base_prompt_on_char">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="form-toggle-row">
          <div>
            <div class="form-toggle-label" x-text="t('settings.disable_on_preset')">ST 预设激活时禁用基础提示词</div>
          </div>
          <label class="toggle">
            <input type="checkbox" x-model="settingsForm.disable_base_prompt_on_preset">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="form-toggle-row">
          <div>
            <div class="form-toggle-label" x-text="t('settings.disable_on_worldbook')">世界书匹配时禁用基础提示词</div>
          </div>
          <label class="toggle">
            <input type="checkbox" x-model="settingsForm.disable_base_prompt_on_worldbook">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:var(--space-3);align-items:center">
        <button class="btn btn-primary" @click="saveSettings()" x-text="t('settings.save')">保存设置</button>
        <button class="btn btn-secondary" @click="restartServer()" x-text="t('settings.restart')">重启服务</button>
        <span style="font-size:var(--text-sm);color:var(--muted)" x-text="t('settings.restart_hint')"></span>
      </div>
    </div>
