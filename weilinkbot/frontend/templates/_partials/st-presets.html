                        <p x-text="t('st_presets.no_presets')">No presets configured</p>

                    <p x-text="t('st_presets.select_preset')">Select a preset to edit</p>

                <template x-for="p in stPresets" :key="'editor-'+p.id">

                                <button class="btn btn-sm btn-danger" @click="deleteSTPreset(p.id, p.name)" x-text="t('models.delete')">Delete</button>

                        </div>
                        <!-- Body with tabs -->
                        <div class="split-editor-body">

                            <div class="tab-bar" role="tablist">

                                <button class="tab-btn" :class="{'active': presetTab === 'advanced'}" @click="presetTab = 'advanced'" role="tab" x-text="t('st_presets.tab_advanced')">Advanced Settings</button>
                                <button class="tab-btn" :class="{'active': presetTab === 'entries'}" @click="presetTab = 'entries'" role="tab" x-text="t('st_presets.tab_entries')">Entries</button>
                            </div>

                            <!-- Tab: Prompt Templates -->
                            <div class="tab-panel" :class="{'active': presetTab === 'prompts'}">
                                <div class="form-group">
                                    <label class="form-label" x-text="t('st_presets.system_prompt')">System Prompt</label>
                                    <textarea x-model="p.system_prompt" rows="6" class="form-input" style="font-family:var(--font-body);line-height:1.6;"></textarea>
                                    <p class="form-hint" x-text="t('st_presets.prompt_hint')">Write the system prompt template for this preset.</p>
                                </div>
                            </div>

                            <!-- Tab: Sampling Parameters -->
                            <div class="tab-panel" :class="{'active': presetTab === 'sampling'}">
                                <div class="card" style="margin-bottom:var(--space-5);">
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.temperature')">Temperature</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.temperature_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="0" max="200" value="70" />
                                            <span class="slider-value">0.70</span>
                                        </div>
                                    </div>
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.top_p')">Top P</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.top_p_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="0" max="100" value="100" />
                                            <span class="slider-value">1.00</span>
                                        </div>
                                    </div>
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.top_k')">Top K</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.top_k_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="0" max="100" value="0" />
                                            <span class="slider-value">0</span>
                                        </div>
                                    </div>
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.typical_p')">Typical P</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.typical_p_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="0" max="100" value="100" />
                                            <span class="slider-value">1.00</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card" style="margin-bottom:var(--space-5);">
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.rep_penalty')">Repetition Penalty</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.rep_penalty_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="100" max="200" value="100" />
                                            <span class="slider-value">1.00</span>
                                        </div>
                                    </div>
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.freq_penalty')">Frequency Penalty</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.freq_penalty_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="0" max="200" value="0" />
                                            <span class="slider-value">0.00</span>
                                        </div>
                                    </div>
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.pres_penalty')">Presence Penalty</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.pres_penalty_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="0" max="200" value="0" />
                                            <span class="slider-value">0.00</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.sampling.max_tokens')">Max Tokens</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.sampling.max_tokens_hint')"></div>
                                        </div>
                                        <div class="slider-row">
                                            <input type="range" min="64" max="8192" step="64" value="2048" />
                                            <span class="slider-value">2048</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Tab: Advanced Settings -->
                            <div class="tab-panel" :class="{'active': presetTab === 'advanced'}">
                                <div class="card" style="margin-bottom:var(--space-5);">
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.advanced.injection_pos')">Injection Position</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.advanced.injection_pos_hint')"></div>
                                        </div>
                                        <select class="form-select" style="width:auto;min-width:140px;">
                                            <option value="0" x-text="t('st_presets.pos_before')">Before main</option>
                                            <option value="1" x-text="t('st_presets.pos_after')">After main</option>
                                        </select>
                                    </div>
                                    <div class="form-toggle-row">
                                        <div>
                                            <div class="form-toggle-label" x-text="t('st_presets.advanced.message_format')">Message Format</div>
                                            <div class="form-toggle-desc" x-text="t('st_presets.advanced.message_format_hint')"></div>
                                        </div>
                                        <select class="form-select" style="width:auto;min-width:140px;">
                                            <option value="chatml">ChatML</option>
                                            <option value="alpaca">Alpaca</option>

                                            <option value="vicuna">Vicuna</option>
                                            <option value="raw">Raw</option>
                                        </select>
                                    </div>
                                </div>

                                    <div class="form-group">
                                        <label class="form-label" x-text="t('st_presets.advanced.raw_json')">Raw JSON</label>

                                        <p class="form-hint" x-text="t('st_presets.advanced.raw_json_hint')">Direct JSON override for advanced configuration.</p>
                                    </div>
                                </div>
                            </div>

                            <div class="tab-panel" :class="{'active': presetTab === 'entries'}">
                                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">
                                    <span style="font-size:var(--text-sm);color:var(--muted);" x-text="t('st_presets.entry_count').replace('{count}', stPresetEntries.length)"></span>
                                    <button class="btn btn-success btn-sm" @click="addSTEntry()">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

                                        <div class="accordion-card"

                                             @dragstart="stDragStart(idx, $event)"
                                             @dragover.prevent="stDragOver(idx, $event)"
                                             @drop="stDrop(idx, $event)">
                                            <!-- Collapsed Header -->
                                            <div class="accordion-header" @click="expandSTEntry(idx)">
                                                <div style="display:flex;align-items:center;gap:var(--space-3);flex:1;min-width:0;">
                                                    <span style="color:var(--muted);cursor:grab;font-size:var(--text-lg);line-height:1;flex-shrink:0;" :title="t('st_presets.entries.drag_hint')">&#9776;</span>
                                                    <label class="toggle" @click.stop>
                                                        <input type="checkbox" :checked="entry.enabled"
                                                               @change="toggleSTPresetEntry(stPresetEntriesPresetId, entry.index, entry.enabled)" />
                                                        <span class="toggle-track"></span>
                                                    </label>
                                                    <span style="font-weight:600;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="entry.name || 'Entry ' + entry.index"></span>

                                                          :class="{
                                                              'badge-accent': entry.role === 'system',
                                                              'badge-green': entry.role === 'user',
                                                              'badge-purple': entry.role === 'assistant'
                                                          }"
                                                          style="flex-shrink:0;"
                                                          x-text="entry.role"></span>
                                                </div>
                                                <svg style="width:16px;height:16px;color:var(--muted);transition:transform var(--motion-fast) var(--ease-standard);flex-shrink:0;"
                                                     :class="{'rotate-180': stExpandedEntry === idx}"
                                                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                                </svg>
                                            </div>
                                            <!-- Expanded Content -->
                                            <div x-show="stExpandedEntry === idx"
                                                 x-transition:enter="transition ease-out duration-200"
                                                 x-transition:enter-start="opacity-0"
                                                 x-transition:enter-end="opacity-100"
                                                 x-transition:leave="transition ease-in duration-150"
                                                 x-transition:leave-start="opacity-100"
                                                 x-transition:leave-end="opacity-0"
                                                 class="accordion-body-inner" style="padding:var(--space-4);border-top:1px solid var(--border);">
                                                <div class="form-group">
                                                    <label class="form-label" x-text="t('st_presets.entry_name')">Entry Name</label>
                                                    <input type="text" :value="entry.name"
                                                           @input="stEntryEditIndex === idx && (stEntryForm.name = $event.target.value)"
                                                           @focus="editSTEntry(entry, idx)"
                                                           class="form-input" :placeholder="t('st_presets.entry_name')">
                                                </div>
                                                <div class="form-row" style="margin-bottom:var(--space-4);">
                                                    <div class="form-group" style="margin-bottom:0;">
                                                        <label class="form-label" x-text="t('st_presets.entry_role')">Role</label>
                                                        <select :value="entry.role"
                                                                @change="stEntryEditIndex === idx && (stEntryForm.role = $event.target.value)"
                                                                @focus="editSTEntry(entry, idx)"
                                                                class="form-select">
                                                            <option value="system">system</option>
                                                            <option value="user">user</option>
                                                            <option value="assistant">assistant</option>
                                                        </select>
                                                    </div>
                                                    <div class="form-group" style="margin-bottom:0;">
                                                        <label class="form-label" x-text="t('st_presets.entry_position')">Position</label>
                                                        <select :value="entry.injection_position"
                                                                @change="stEntryEditIndex === idx && (stEntryForm.injection_position = parseInt($event.target.value))"
                                                                @focus="editSTEntry(entry, idx)"
                                                                class="form-select">
                                                            <option value="0" x-text="t('st_presets.pos_before')"></option>
                                                            <option value="1" x-text="t('st_presets.pos_after')"></option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label" x-text="t('st_presets.entry_depth')">Depth</label>
                                                    <div class="slider-row">
                                                        <input type="range" min="0" max="100"
                                                               :value="entry.injection_depth"
                                                               @input="stEntryEditIndex === idx && (stEntryForm.injection_depth = parseInt($event.target.value) || 0)"
                                                               @focus="editSTEntry(entry, idx)" />
                                                        <span class="slider-value" x-text="entry.injection_depth"></span>
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label" x-text="t('st_presets.entry_content')">Content</label>
                                                    <textarea :value="entry.content" rows="5"
                                                              @input="stEntryEditIndex === idx && (stEntryForm.content = $event.target.value)"
                                                              @focus="editSTEntry(entry, idx)"
                                                              class="form-input" style="font-family:var(--font-mono);"
                                                              :placeholder="t('st_presets.entry_content')"></textarea>
                                                </div>
                                                <div style="display:flex;align-items:center;justify-content:space-between;padding-top:var(--space-3);border-top:1px solid var(--border);">
                                                    <div style="display:flex;gap:var(--space-1);">
                                                        <button @click="moveSTEntry(idx, -1)" :disabled="idx === 0"
                                                                class="btn-icon btn-sm" style="width:28px;height:28px;" title="Move up">
                                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><path d="M18 15l-6-6-6 6"/></svg>
                                                        </button>
                                                        <button @click="moveSTEntry(idx, 1)" :disabled="idx === stPresetEntries.length - 1"
                                                                class="btn-icon btn-sm" style="width:28px;height:28px;" title="Move down">
                                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><path d="M6 9l6 6 6-6"/></svg>
                                                        </button>
                                                    </div>
                                                    <div style="display:flex;gap:var(--space-2);">
                                                        <button class="btn btn-primary btn-sm" @click="saveSTEntry()" x-show="stEntryEditIndex === idx">
                                                            <span x-text="t('st_presets.save_entry')"></span>
                                                        </button>
                                                        <button class="btn btn-danger btn-sm" @click="deleteSTEntry(idx)">
                                                            <span x-text="t('st_presets.delete_entry')"></span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
